                <!-- Bind the first swipe as soon as the visible cover enters the DOM. -->
                <script>
                    (() => {
                        const preview = document.getElementById('firstPagePreview');
                        if (!preview) return;
                        preview.style.touchAction = 'none';
                        let start = null;
                        const isMobile = () => matchMedia('(max-width: 768px) and (pointer: coarse)').matches;
                        const queueNext = (corner = 'bottom') => {
                            window.__flipbookPreviewNextRequested = true;
                            window.__flipbookPreviewNextCorner = corner;
                            preview.classList.add('is-queued');
                        };
                        preview.addEventListener('touchstart', (event) => {
                            if (!isMobile() || event.touches.length !== 1) return;
                            const touch = event.touches[0];
                            start = { x: touch.clientX, y: touch.clientY };
                        }, { passive: true });
                        preview.addEventListener('touchmove', (event) => {
                            if (!isMobile() || !start || event.touches.length !== 1) return;
                            const touch = event.touches[0];
                            const dx = touch.clientX - start.x;
                            const dy = touch.clientY - start.y;
                            if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) {
                                preview.classList.add('is-swiping');
                                event.preventDefault();
                            }
                        }, { passive: false });
                        preview.addEventListener('touchend', (event) => {
                            if (!isMobile() || !start || event.changedTouches.length !== 1) return;
                            const touch = event.changedTouches[0];
                            const dx = touch.clientX - start.x;
                            const dy = touch.clientY - start.y;
                            start = null;
                            if (dx < -30 && Math.abs(dx) > Math.abs(dy) * 1.2) {
                                event.preventDefault();
                                event.stopPropagation();
                                queueNext('bottom');
                            }
                            preview.classList.remove('is-swiping');
                        }, { passive: false });
                        preview.addEventListener('touchcancel', () => {
                            start = null;
                            preview.classList.remove('is-swiping');
                        }, { passive: true });
                        // 首次布局尚未稳定时预览层可能暂时未铺满屏幕，文档捕获兜底可避免中部左滑落到外层而丢失。
                        const isExcludedTarget = (target) => target?.closest?.('.mobile-toolbar, .mobile-drawer, button, input, textarea, select');
                        let documentStart = null;
                        document.addEventListener('touchstart', (event) => {
                            if (!preview.isConnected || preview.classList.contains('is-hidden') || !isMobile() || isExcludedTarget(event.target) || event.touches.length !== 1) return;
                            const touch = event.touches[0];
                            documentStart = { x: touch.clientX, y: touch.clientY };
                        }, { passive: true, capture: true });
                        document.addEventListener('touchmove', (event) => {
                            if (!preview.isConnected || preview.classList.contains('is-hidden') || !isMobile() || !documentStart || event.touches.length !== 1) return;
                            const touch = event.touches[0];
                            const dx = touch.clientX - documentStart.x;
                            const dy = touch.clientY - documentStart.y;
                            if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) {
                                preview.classList.add('is-swiping');
                                event.preventDefault();
                            }
                        }, { passive: false, capture: true });
                        document.addEventListener('touchend', (event) => {
                            if (!preview.isConnected || preview.classList.contains('is-hidden') || !isMobile() || !documentStart || event.changedTouches.length !== 1) return;
                            const touch = event.changedTouches[0];
                            const dx = touch.clientX - documentStart.x;
                            const dy = touch.clientY - documentStart.y;
                            documentStart = null;
                            preview.classList.remove('is-swiping');
                            if (dx < -30 && Math.abs(dx) > Math.abs(dy) * 1.2) {
                                event.preventDefault();
                                event.stopPropagation();
                                queueNext('bottom');
                            }
                        }, { passive: false, capture: true });
                        document.addEventListener('touchcancel', () => {
                            documentStart = null;
                            preview.classList.remove('is-swiping');
                        }, { passive: true, capture: true });
                        window.__flipbookEarlySwipeReady = true;
                    })();
                </script>

                <script>
                    (() => {
                    const bar = document.getElementById('flipHintBar');
                        if (!bar || !matchMedia('(max-width: 768px) and (pointer: coarse)').matches) return;

                        // 分享深链优先展示目标页，不让首次 GIF 覆盖目标页加载过程。
                        const sharedPage = Number.parseInt(new URLSearchParams(window.location.search).get('page'), 10);
                        if (Number.isInteger(sharedPage) && sharedPage >= 1) return;

                        const seenKey = 'flipSwipeGifSeenV1';
                        let seen = false;
                        try { seen = localStorage.getItem(seenKey) === '1'; } catch (e) { /* 隐私模式下仍显示 */ }
                        if (seen) return;

                        const gif = bar.querySelector('.flip-hint-gif');
                        if (gif && !gif.getAttribute('src')) gif.src = gif.dataset.src;
                        bar.classList.remove('hidden');
                        bar.setAttribute('aria-hidden', 'false');
                        window.__flipSwipeHintShownAt = Date.now();
                        try { localStorage.setItem(seenKey, '1'); } catch (e) { /* 隐私模式下无法持久化 */ }
                        const hideHint = () => {
                            bar.classList.add('hidden');
                            bar.setAttribute('aria-hidden', 'true');
                            if (window.__flipSwipeHintDismissHandler) {
                                document.removeEventListener('pointerdown', window.__flipSwipeHintDismissHandler, true);
                                document.removeEventListener('touchstart', window.__flipSwipeHintDismissHandler, true);
                                document.removeEventListener('mousedown', window.__flipSwipeHintDismissHandler, true);
                                document.removeEventListener('click', window.__flipSwipeHintDismissHandler, true);
                                window.__flipSwipeHintDismissHandler = null;
                            }
                            if (window.__flipSwipeHintTimer) {
                                clearTimeout(window.__flipSwipeHintTimer);
                                window.__flipSwipeHintTimer = null;
                            }
                        };
                        window.__hideFlipSwipeHint = hideHint;
                        window.__flipSwipeHintDismissHandler = hideHint;
                        document.addEventListener('pointerdown', hideHint, { capture: true, passive: true });
                        document.addEventListener('touchstart', hideHint, { capture: true, passive: true });
                        document.addEventListener('mousedown', hideHint, { capture: true, passive: true });
                        document.addEventListener('click', hideHint, { capture: true, passive: true });
                        window.__flipSwipeHintTimer = setTimeout(hideHint, 6000);
                    })();
                </script>

            <input type="text" id="mobileSearchInput" placeholder="输入关键字搜索..." />
            <button type="button" class="mobile-search-submit" id="mobileSearchSubmit" aria-label="搜索">搜索</button>
        </div>

        <div class="mobile-drawer" id="mobileDrawer">
            <div class="mobile-drawer-header">
                <span id="drawerTitle">目录</span>
                <button id="closeMobileDrawer" title="关闭">&times;</button>
            </div>
            <div class="drawer-body" id="drawerBody">
                <div id="drawerToc"></div>
                <div id="drawerThumb" class="drawer-view"></div>
                <div id="drawerSearch" class="drawer-view">
                    <div id="mobileSearchResults" class="search-results"></div>
                </div>
            </div>
        </div>
        <div class="mobile-backdrop" id="mobileBackdrop"></div>
    </div>

    <!-- 主 JS 尚未下载完时也按移动端规则记录封面操作，避免极早操作丢失。 -->
    <script>
        (() => {
            const preview = document.getElementById('firstPagePreview');
            const image = document.getElementById('firstPagePreviewImage');
            if (!preview || !image) return;
            const isMobile = () => window.matchMedia('(max-width: 768px) and (pointer: coarse)').matches;
            const isCorner = (x, y, rect) => {
                const localX = x - rect.left;
                const localY = y - rect.top;
                const size = Math.hypot(rect.width, rect.height) / 6;
                return localX >= 0 && localX <= rect.width && localY >= 0 && localY <= rect.height
                    && (localX < size || localX > rect.width - size)
                    && (localY < size || localY > rect.height - size);
            };
            const queueNext = (corner = 'bottom') => {
                window.__flipbookPreviewNextRequested = true;
                window.__flipbookPreviewNextCorner = corner;
                preview.classList.add('is-queued');
            };
            preview.addEventListener('click', (event) => {
                if (!isMobile()) return;
                const rect = image.getBoundingClientRect();
                if (rect.width <= 0 || !isCorner(event.clientX, event.clientY, rect)) return;
                if (event.clientX < rect.left + rect.width / 2) return;
                queueNext('bottom');
            }, true);

            let touchStart = null;
            preview.addEventListener('touchstart', (event) => {
                if (!isMobile() || event.touches.length !== 1) return;
                const touch = event.touches[0];
                touchStart = { x: touch.clientX, y: touch.clientY, swiping: false };
            }, { passive: true });
            preview.addEventListener('touchmove', (event) => {
                if (!isMobile() || !touchStart || event.touches.length !== 1) return;
                const touch = event.touches[0];
                const dx = touch.clientX - touchStart.x;
                const dy = touch.clientY - touchStart.y;
                if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) {
                    touchStart.swiping = true;
                    preview.classList.add('is-swiping');
                    event.preventDefault();
                }
            }, { passive: false });
            preview.addEventListener('touchend', (event) => {
                if (!isMobile() || !touchStart || event.changedTouches.length !== 1) return;
                const touch = event.changedTouches[0];
                const dx = touch.clientX - touchStart.x;
                const dy = touch.clientY - touchStart.y;
                touchStart = null;
                preview.classList.remove('is-swiping');
                if (dx < -30 && Math.abs(dx) > Math.abs(dy) * 1.2) {
                    event.preventDefault();
                    event.stopPropagation();
                    queueNext('bottom');
                }
            }, { passive: false });
            preview.addEventListener('touchcancel', () => {
                touchStart = null;
                preview.classList.remove('is-swiping');
            }, { passive: true });
        })();
    </script>
    <!-- finder.js 在 PDF 第一页绘制完成后由 tracker.js 异步加载。 -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
