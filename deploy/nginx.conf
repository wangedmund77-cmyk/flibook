server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    etag on;

    # Compress the PDF.js worker and application assets. The PDF location below
    # disables gzip explicitly so byte ranges stay predictable.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript text/javascript text/css application/json;

    # Production assets are built with Vite base=/pdf/ and must be copied to
    # /usr/share/nginx/html/pdf/ on the remote server.
    location = /pdf {
        return 301 /pdf/;
    }

    # PDF.js requests this exact URL. Nginx static serving supports Range/206
    # by default; gzip stays disabled so byte ranges remain predictable.
    location = /pdf/sample.pdf {
        try_files $uri =404;
        types {
            application/pdf pdf;
        }
        gzip off;
        add_header X-Nginx-Request-Time $request_time always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* ^/pdf/assets/.*\.mjs$ {
        try_files $uri =404;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Vite filenames under /assets/ contain a content hash.
    location /pdf/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Inserted HTML pages and other runtime data must exist as real files.
    location /pdf/data/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location /pdf/fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Runtime insertion mapping changes independently from hashed JS assets.
    location = /pdf/insert-config.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Application entry and other public resources. index.html is revalidated
    # so a new hashed JS bundle takes effect without a one-hour stale cache.
    location /pdf/ {
        try_files $uri $uri/ /pdf/index.html;
        add_header Cache-Control "no-cache" always;
    }
}
