<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=760,initial-scale=1"><meta name="color-scheme" content="light"><title>O2 · 目录台账｜横向分带</title><style>
:root {
  --se-green: #3dcd58;
  --se-green-dark: #18852f;
  --se-forest: #0b3020;
  --ink: #12231b;
  --body: #4f5f57;
  --muted: #758079;
  --line: #cbd1cd;
  --line-soft: #e2e7e3;
  --paper: #fff;
  --soft-green: #eef8f0;
  --page-w: 760px;
  --page-h: 1074.8571428571px;
  --spread-w: 1520px;
}

*, *::before, *::after { box-sizing: border-box; }
html { min-width: 320px; background: #07100c; color-scheme: dark; }
body, body * { font-family: "Microsoft YaHei", "微软雅黑", sans-serif !important; }
body { margin: 0; min-width: 320px; color: var(--ink); background: #07100c; }
button, a { font: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; }
h1, h2, h3, p { margin: 0; }
sup { font-size: .52em; line-height: 0; vertical-align: super; }

/* Review shell */
.review-shell { min-height: 100vh; padding: 0 18px 28px; }
.review-topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: grid;
  grid-template-columns: minmax(235px, 1fr) auto minmax(235px, 1fr);
  gap: 18px;
  align-items: center;
  min-height: 72px;
  margin: 0 -18px;
  padding: 11px 22px;
  color: #e8f2eb;
  background: rgba(7, 16, 12, .94);
  border-bottom: 1px solid rgba(255,255,255,.09);
  backdrop-filter: blur(14px);
}
.review-brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.review-brand-mark {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 9px;
  background: var(--se-green);
  color: #092213;
  font-size: 12px;
  font-weight: 900;
}
.review-brand strong { display: block; font-size: 14px; line-height: 1.2; }
.review-brand small { display: block; margin-top: 3px; color: rgba(232,242,235,.58); font-size: 9px; }
.category-tabs, .view-controls, .mode-tabs, .presentation-tabs { display: flex; align-items: center; gap: 6px; }
.category-tabs { justify-content: center; }
.view-controls { justify-content: flex-end; }
.control-cluster {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px;
  background: rgba(255,255,255,.04);
}
.category-tab, .mode-button, .presentation-button {
  min-height: 34px;
  padding: 0 13px;
  border: 0;
  border-radius: 7px;
  color: rgba(232,242,235,.58);
  background: transparent;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
  transition: color .18s ease, background .18s ease;
}
.category-tab:hover, .mode-button:hover, .presentation-button:hover { color: #fff; background: rgba(255,255,255,.07); }
.category-tab.active, .mode-button.active, .presentation-button.active { color: #07100c; background: var(--se-green); }
.presentation-tabs[hidden] { display: none; }

.review-stage { max-width: 1780px; margin: 0 auto; }
.stage-heading {
  min-height: 61px;
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  padding: 12px 4px 10px;
  color: #f2f6f3;
}
.stage-heading h1 { font-size: 16px; line-height: 1.2; }
.stage-heading p { margin-top: 4px; color: rgba(242,246,243,.55); font-size: 10px; }
.mode-badge {
  flex: 0 0 auto;
  padding: 6px 9px;
  border: 1px solid rgba(61,205,88,.35);
  border-radius: 999px;
  color: #9becaa;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .04em;
}
.review-artboard { min-height: 1px; }

.single-showcase {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  align-items: start;
}
.single-variant-card {
  min-width: 0;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 13px;
  background: #111b16;
  box-shadow: 0 18px 40px rgba(0,0,0,.24);
  transition: border-color .18s ease, transform .18s ease;
}
.single-variant-card.selected { border-color: rgba(61,205,88,.7); }
.single-variant-card:hover { transform: translateY(-2px); border-color: rgba(61,205,88,.55); }
.variant-review-head {
  min-height: 61px;
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto;
  gap: 9px;
  align-items: center;
  padding: 9px 10px;
  color: #edf4ef;
}
.variant-code {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: #183a25;
  color: var(--se-green);
  font-size: 10px;
  font-weight: 900;
}
.variant-review-head strong { display: block; overflow: hidden; font-size: 11px; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
.variant-review-head small { display: block; margin-top: 3px; overflow: hidden; color: rgba(237,244,239,.5); font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
.page-export-button, .focus-export-button {
  min-height: 31px;
  padding: 0 10px;
  border: 1px solid rgba(61,205,88,.55);
  border-radius: 6px;
  color: #07100c;
  background: var(--se-green);
  font-size: 9px;
  font-weight: 900;
  white-space: nowrap;
}
.page-export-button:hover, .focus-export-button:hover { background: #fff; border-color: #fff; }
.single-preview-shell {
  position: relative;
  width: 100%;
  aspect-ratio: 210 / 297;
  overflow: hidden;
  background: #fff;
}
.single-preview-canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--page-w);
  height: var(--page-h);
  transform-origin: 0 0;
}

.publication-review { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.publication-toolbar {
  width: min(100%, 1520px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 8px 10px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 10px;
  color: #eaf2ec;
  background: rgba(255,255,255,.04);
}
.publication-toolbar span { font-size: 10px; color: rgba(234,242,236,.62); }
.publication-toolbar strong { color: #fff; }
.focused-variant-tabs { display: flex; gap: 5px; flex: 0 0 auto; }
.focused-variant-button {
  width: 34px;
  height: 30px;
  padding: 0;
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 6px;
  color: rgba(255,255,255,.62);
  background: transparent;
  font-size: 9px;
  font-weight: 900;
}
.focused-variant-button:hover { color: #fff; border-color: rgba(61,205,88,.5); }
.focused-variant-button.active { color: #07100c; border-color: var(--se-green); background: var(--se-green); }
.publication-frame {
  position: relative;
  width: min(100%, calc((100dvh - 182px) * 210 / 297));
  aspect-ratio: 210 / 297;
  overflow: hidden;
  border-radius: 9px;
  background: #fff;
  box-shadow: 0 24px 55px rgba(0,0,0,.34);
}
.publication-frame[data-publication-mode="spread"] {
  width: min(100%, calc((100dvh - 182px) * 420 / 297));
  aspect-ratio: 420 / 297;
}
.publication-canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--page-w);
  height: var(--page-h);
  transform-origin: 0 0;
}
.publication-frame[data-publication-mode="spread"] .publication-canvas { width: var(--spread-w); }

/* Atomic publication pages */
.single-page, .spread-page {
  position: relative;
  overflow: hidden;
  color: var(--ink);
  background: var(--paper);
  isolation: isolate;
}
.single-page { width: var(--page-w); height: var(--page-h); }
.spread-page {
  width: var(--spread-w);
  height: var(--page-h);
  display: grid;
  grid-template-columns: repeat(2, var(--page-w));
}
.spread-page::after {
  content: "";
  position: absolute;
  z-index: 50;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 2px;
  transform: translateX(-1px);
  background: #d8ddda;
  pointer-events: none;
}
.spread-leaf { position: relative; width: var(--page-w); height: var(--page-h); overflow: hidden; background: #fff; }
.paper-pad, .leaf-pad {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 66px 84px 32px;
}
.paper-topline {
  min-height: 13px;
  margin: 0 0 24px;
  color: #7a827e;
  font-size: 10px;
  line-height: 1.25;
  font-weight: 400;
}
.paper-topline-label { display: block; white-space: nowrap; }
.paper-footer {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: auto;
  padding-top: 14px;
  color: #828b86;
  font-size: 10px;
  line-height: 1.25;
  text-align: center;
}
.hairline { height: 1px; background: var(--line); }
.green-rule { height: 2px; background: var(--line); }
.page-photo { overflow: hidden; background: #dfe9e1; }
.page-photo img { width: 100%; height: 100%; display: block; object-fit: cover; }

/* Opening O1 — current V18 */
.opening-o1 .opening-title { margin-top: 0; font-size: 54px; line-height: 1.06; letter-spacing: -.045em; font-weight: 900; }
.opening-o1 .opening-summary { margin-top: 17px; color: var(--body); font-size: 19px; line-height: 1.62; }
.opening-o1 .opening-photo { height: 273px; margin-top: 20px; border-radius: 9px; }
.opening-o1 .opening-photo img { object-position: 54% 54%; filter: saturate(.82) contrast(1.02); }
.opening-o1 .opening-map {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-height: 0;
  margin: 18px -84px 0;
  padding: 18px 84px 15px;
  border-radius: 0;
  background: transparent;
}
.opening-map-heading { font-size: 18px; line-height: 1.3; font-weight: 900; }
.opening-map-heading::after { content: ""; display: block; width: 46px; height: 3px; margin-top: 11px; background: var(--se-green); }
.opening-map-list { display: grid; grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 7px; flex: 1; min-height: 0; margin-top: 14px; }
.opening-map-row {
  position: relative;
  min-height: 0;
  display: grid;
  grid-template-columns: 43px 1fr;
  gap: 13px;
  align-items: center;
  padding: 8px 13px;
  border: 1px solid #d8e7db;
  border-radius: 8px;
  background: #fff;
}
.opening-map-row:hover { border-color: var(--se-green); }
.opening-index {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--se-green);
  color: #0b2b16;
  font-size: 13px;
  font-weight: 900;
}
.opening-map-copy { min-width: 0; padding-right: 24px; }
.opening-map-name { display: block; font-size: 16px; line-height: 1.22; font-weight: 900; }
.opening-map-note { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.3; }
.opening-chevron { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--se-green-dark); font-size: 26px; line-height: 1; font-weight: 900; }

/* Opening O2 — editorial contents ledger */
.opening-o2 .opening-title { margin-top: 0; max-width: 620px; font-size: 54px; line-height: 1.03; letter-spacing: -.045em; font-weight: 900; }
.opening-o2 .opening-summary { margin-top: 18px; color: var(--body); font-size: 18px; line-height: 1.62; }
.opening-o2 .opening-photo { height: 300px; margin-top: 23px; border-radius: 2px; }
.opening-o2 .opening-photo img { object-position: 50% 55%; }
.opening-guide { color: var(--ink); font-size: 14px; line-height: 1.4; font-weight: 900; }
.opening-o2 .opening-guide { margin-top: 18px; }
.opening-o2 .chapter-matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; margin-top: 10px; border-top: 2px solid var(--line); }
.chapter-matrix-row {
  position: relative;
  min-height: 108px;
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: 11px;
  align-content: center;
  border-bottom: 1px solid var(--line);
}
.chapter-matrix-row .chapter-number { color: var(--se-green-dark); font-size: 24px; line-height: 1; font-weight: 900; }
.chapter-matrix-row strong { display: block; font-size: 17px; line-height: 1.25; }
.chapter-matrix-row small { display: block; margin-top: 6px; color: var(--muted); font-size: 11px; line-height: 1.4; }
.chapter-matrix-row .chapter-chevron { position: absolute; right: 0; top: 50%; transform: translateY(-50%); color: var(--se-green-dark); font-size: 18px; line-height: 1; }

/* Opening O3 — asymmetric index */
.opening-o3 .opening-split { display: grid; grid-template-columns: 58fr 42fr; gap: 24px; min-height: 500px; }
.opening-o3 .opening-copy-column { display: flex; flex-direction: column; padding-top: 0; }
.opening-o3 .opening-title { margin-top: 0; font-size: 56px; line-height: 1.03; letter-spacing: -.045em; font-weight: 900; }
.opening-o3 .opening-summary { margin-top: 22px; color: var(--body); font-size: 18px; line-height: 1.66; }
.opening-o3 .opening-photo { height: 500px; border-radius: 0; }
.opening-o3 .opening-photo img { object-position: 64% 50%; }
.opening-o3 .opening-guide { margin-top: 20px; }
.opening-o3 .opening-index-ledger { margin-top: 10px; border-top: 2px solid var(--line); }
.opening-index-row {
  display: grid;
  grid-template-columns: 48px 170px minmax(0, 1fr) 18px;
  gap: 12px;
  align-items: center;
  min-height: 72px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}
.opening-index-row .chapter-number { color: var(--se-green-dark); font-size: 19px; font-weight: 900; }
.opening-index-row strong { font-size: 17px; }
.opening-index-row small { color: var(--muted); font-size: 12px; line-height: 1.4; }
.opening-index-row .chapter-chevron { position: static; display: inline-flex; align-self: center; justify-self: end; align-items: center; color: var(--se-green-dark); font-size: 18px; line-height: 1; }

/* Video primitives */
.video-title { font-size: 40px; line-height: 1.12; letter-spacing: -.04em; font-weight: 900; }
.video-summary { color: var(--body); font-size: 17px; line-height: 1.55; }
.cc-video-shell {
  position: relative;
  width: 100%;
  overflow: hidden;
  border-radius: 7px;
  background: #0c1410;
}
.video-poster {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  padding: 0;
  border: 0;
  background: #0c1410;
}
.video-poster img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: 50% 52%; }
.video-poster::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.32), transparent 35%, rgba(0,0,0,.36)); pointer-events: none; }
.cc-chip { position: absolute; z-index: 2; left: 16px; top: 15px; padding: 7px 10px; border-radius: 999px; color: #fff; background: rgba(12,20,16,.78); font-size: 10px; font-weight: 900; letter-spacing: .1em; }
.video-caption { position: absolute; z-index: 2; left: 18px; right: 18px; bottom: 16px; color: #fff; font-size: 14px; font-weight: 900; }
.poster-play {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: 50%;
  width: 68px;
  height: 68px;
  display: grid;
  place-items: center;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(255,255,255,.72);
  border-radius: 50%;
  color: #222;
  background: rgba(255,255,255,.95);
  box-shadow: 0 8px 22px rgba(0,0,0,.2);
  transition: transform .18s ease, background .18s ease, color .18s ease;
}
.poster-play::after { content: ""; width: 0; height: 0; margin-left: 5px; border-top: 11px solid transparent; border-bottom: 11px solid transparent; border-left: 16px solid currentColor; }
.video-poster:hover .poster-play { transform: translate(-50%, -50%) scale(1.04); color: #000; background: #fff; }
.cc-player-host { position: absolute; z-index: 4; inset: 0; background: #0c1410; }
.cc-player-host[hidden], .cc-video-status[hidden] { display: none; }
.cc-video-status { position: absolute; z-index: 5; left: 14px; right: 14px; bottom: 14px; padding: 11px 13px; border-radius: 6px; color: #fff; background: rgba(9,17,13,.86); font-size: 11px; }
.cc-video-status strong, .cc-video-status span { display: block; }
.cc-video-status span { margin-top: 3px; color: rgba(255,255,255,.68); font-size: 9px; }
.video-meta { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 10px; letter-spacing: .05em; }
.video-point-row {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 10px;
  align-items: center;
  min-height: 47px;
  padding: 9px 11px;
  border-left: 3px solid var(--se-green);
  color: #31433a;
  background: var(--soft-green);
  font-size: 13px;
  line-height: 1.3;
}
.video-point-number { color: var(--se-green-dark); font-size: 11px; font-weight: 900; }
.case-cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  align-self: flex-start;
  min-height: 43px;
  padding: 0 18px;
  border: 1px solid var(--se-green);
  border-radius: 4px;
  color: #000;
  background: var(--se-green);
  font-size: 12px;
  font-weight: 900;
}
.case-cta:hover { background: #fff; }

/* C1 — current V18 */
.video-c1 .video-copy { padding-top: 0; }
.video-c1 .video-title { margin-top: 0; }
.video-c1 .video-summary { margin-top: 15px; }
.video-c1 .video-panel { display: flex; flex: 1; flex-direction: column; min-height: 0; margin: 20px -84px 0; padding: 14px 84px; border-radius: 0; background: transparent; }
.video-c1 .cc-video-shell { aspect-ratio: 16 / 9; flex: 0 0 auto; }
.video-c1 .video-meta { margin: 11px 2px 4px; }
.video-c1 .video-point-list { display: grid; gap: 6px; margin-top: 5px; }
.video-c1 .video-point-row { background: transparent; }
.video-c1 .case-cta { margin-top: 12px; }

/* C2 — video feature */
.video-c2 .video-title { margin-top: 0; font-size: 40px; }
.video-c2 .video-summary { margin-top: 15px; }
.video-c2 .feature-video { aspect-ratio: 16 / 9; margin-top: 22px; border-radius: 2px; }
.video-c2 .video-meta { margin-top: 9px; }
.video-c2 .video-point-matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; margin-top: 18px; border-top: 2px solid var(--line); }
.video-c2 .video-point-row { min-height: 87px; padding: 12px 0; border-left: 0; border-bottom: 1px solid var(--line); background: #fff; }
.video-c2 .case-cta { margin-top: 15px; }

/* C3 — C2 hierarchy with a vertical evidence list */
.video-c3 .video-title { margin-top: 0; font-size: 41px; }
.video-c3 .video-summary { margin-top: 14px; font-size: 16px; }
.video-c3 .dossier-video { aspect-ratio: 16 / 9; height: auto; margin-top: 20px; border-radius: 2px; }
.video-c3 .video-meta { margin-top: 9px; }
.video-c3 .video-point-list { margin-top: 14px; border-top: 2px solid var(--line); }
.video-c3 .video-point-row { min-height: 54px; padding: 9px 4px; border-left: 0; border-bottom: 1px solid var(--line); background: #fff; }
.video-c3 .case-cta { margin-top: 12px; }

/* Closing common */
.closing-title { font-size: 48px; line-height: 1.05; letter-spacing: -.045em; font-weight: 900; }
.closing-summary { color: var(--body); font-size: 16px; line-height: 1.55; }
.resource-card { min-width: 0; overflow: hidden; border: 1px solid var(--line-soft); background: #fff; }
.resource-card:hover { border-color: var(--se-green); }
.resource-image, .resource-thumb { display: block; min-width: 0; min-height: 0; overflow: hidden; }
.resource-card img { width: 100%; height: 100%; display: block; object-fit: cover; }
.resource-label { display: block; color: #111; font-size: 13px; line-height: 1.1; font-weight: 900; letter-spacing: .06em; }
.resource-title { display: block; margin-top: 7px; color: #111; font-size: 15px; line-height: 1.35; font-weight: 900; }
.resource-chevron { display: inline-flex; align-items: center; justify-content: center; margin-left: 4px; color: var(--se-green-dark); font-size: 18px; line-height: 1; font-weight: 900; vertical-align: middle; white-space: nowrap; }
.research-banner {
  display: grid;
  grid-template-columns: 42fr 58fr;
  min-height: 126px;
  margin-top: 14px;
  overflow: hidden;
  border: 1px solid var(--line-soft);
  background: #fff;
}
.research-banner-image { display: block; min-width: 0; overflow: hidden; }
.research-banner-image img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: right center; }
.research-banner-copy { display: flex; flex-direction: column; min-width: 0; padding: 13px 15px; }
.research-banner strong { color: var(--ink); font-size: 19px; line-height: 1.2; }
.research-banner small { margin-top: 6px; color: var(--muted); font-size: 10px; line-height: 1.4; }
.research-link { display: inline-flex; align-items: center; gap: 5px; margin-top: auto; color: #111; font-size: 10px; line-height: 1; font-weight: 900; }
.research-link [aria-hidden="true"] { display: inline-flex; align-items: center; font-size: 16px; line-height: 1; }
.action-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  min-height: 118px;
  padding: 17px 19px;
  color: #fff;
  background: var(--se-forest);
}
